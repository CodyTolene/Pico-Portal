name: Lint

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tooling
        run: python -m pip install -r requirements.txt

      - name: Install device compiler
        run: python -m pip install mpy-cross==1.27.0.post2

      - name: Syntax check (MicroPython sources)
        run: |
          python -B - <<'PY'
          from pathlib import Path

          for path in Path("src").rglob("*.py"):
              compile(path.read_text(encoding="utf-8"), str(path), "exec")
          PY

      - name: Black (format check)
        run: python -m black --check src/ .scripts/

      - name: Flake8
        run: python -m flake8 --show-source src/ .scripts/

      - name: Build helper regression tests
        run: python -B .scripts/tooling/build_test.py

      - name: Config schema, persistence, and sorting checks
        run: python -B .scripts/tooling/config_test.py

      - name: Device build
        run: python -B .scripts/build.py
